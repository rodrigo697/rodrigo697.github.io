<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2CR — Logo Animado Hero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .hero-logo-wrapper {
    position: relative;
    width: 560px;
    max-width: 88vw;
  }
  .halo {
    position: absolute;
    inset: -20%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(204,30,30,0.30) 0%,
      rgba(204,30,30,0.10) 40%,
      transparent 70%
    );
    animation: haloFadeIn 1.2s ease-out 0.2s both, haloPulse 4s ease-in-out 2s infinite alternate;
    pointer-events: none;
  }
  @keyframes haloFadeIn { from{opacity:0;transform:scale(0.6)} to{opacity:1;transform:scale(1)} }
  @keyframes haloPulse  { from{transform:scale(1);opacity:.85}  to{transform:scale(1.08);opacity:1} }

  .logo-img {
    position: relative;
    width: 100%;
    display: block;
    opacity: 0;
    transform: translateY(28px) scale(.94);
    animation:
      logoEntrance 1.1s cubic-bezier(.16,1,.3,1) .4s forwards,
      logoFloat    6s ease-in-out 2s infinite alternate;
    mix-blend-mode: screen;
    filter: brightness(1.05) contrast(1.08);
  }
  @keyframes logoEntrance {
    from { opacity:0; transform:translateY(28px) scale(.94); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes logoFloat {
    from { transform:translateY(0px)  scale(1); }
    to   { transform:translateY(-9px) scale(1.013); }
  }
  .spark {
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:#e83838; filter:blur(2px); opacity:0; pointer-events:none;
  }
  .spark-1 { top:12%;    left:16%;   animation:sparkAnim 3.5s ease-in-out 2.2s infinite; }
  .spark-2 { top:10%;    right:14%;  animation:sparkAnim 3.5s ease-in-out 3.0s infinite; }
  .spark-3 { bottom:15%; left:22%;   animation:sparkAnim 3.5s ease-in-out 2.7s infinite; }
  .spark-4 { bottom:12%; right:18%;  animation:sparkAnim 3.5s ease-in-out 3.4s infinite; }
  @keyframes sparkAnim {
    0%,100%{opacity:0;transform:scale(.5)} 30%,70%{opacity:.8;transform:scale(1.5)}
  }
  .shimmer {
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
    opacity:0; animation:shimmerReveal .01s 1.6s forwards;
  }
  @keyframes shimmerReveal { to{opacity:1} }
  .shimmer::after {
    content:''; position:absolute; top:0; left:-100%; width:50%; height:100%;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.13) 50%,transparent 60%);
    animation:shimmerMove 5s ease-in-out 1.8s infinite;
  }
  @keyframes shimmerMove { 0%{left:-60%} 40%{left:120%} 100%{left:120%} }
  .tagline {
    text-align:center; margin-top:16px;
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    font-size:clamp(10px,1.3vw,13px); font-weight:300;
    letter-spacing:.4em; text-transform:uppercase;
    color:rgba(255,255,255,.45);
    opacity:0; transform:translateY(10px);
    animation:taglineIn .8s ease-out 1.7s forwards;
  }
  @keyframes taglineIn { to{opacity:1;transform:translateY(0)} }
</style>
</head>
