<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2CR — Logo Animado Hero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .hero-logo-wrapper {
    position: relative;
    width: 600px;
    max-width: 90vw;
  }

  /* ──────────────────────────────────────────
     HALO DE LUZ detrás del logo
  ────────────────────────────────────────── */
  .halo {
    position: absolute;
    inset: -18%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(204, 30, 30, 0.28) 0%,
      rgba(204, 30, 30, 0.10) 40%,
      transparent 70%
    );
    animation:
      haloFadeIn 1.2s ease-out 0.2s both,
      haloPulse 4s ease-in-out 2s infinite alternate;
    pointer-events: none;
  }

  @keyframes haloFadeIn {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes haloPulse {
    from { transform: scale(1);    opacity: 0.85; }
    to   { transform: scale(1.08); opacity: 1; }
  }

  /* ──────────────────────────────────────────
     IMAGEN PRINCIPAL
  ────────────────────────────────────────── */
  .logo-img {
    position: relative;
    width: 100%;
    display: block;

    /* Entrada: aparece y sube ligeramente */
    opacity: 0;
    transform: translateY(28px) scale(0.94);
    animation:
      logoEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards,
      logoFloat    6s   ease-in-out                    2s infinite alternate;
    will-change: transform, opacity;

    /* Fondo negro del JPEG → transparente via mix-blend-mode */
    mix-blend-mode: screen;
    filter: brightness(1.05) contrast(1.08);
  }

  @keyframes logoEntrance {
    from {
      opacity: 0;
      transform: translateY(28px) scale(0.94);
    }
    to {
      opacity: 1;
      transform: translateY(0px) scale(1);
    }
  }

  @keyframes logoFloat {
    from { transform: translateY(0px)  scale(1); }
    to   { transform: translateY(-8px) scale(1.012); }
  }

  /* ──────────────────────────────────────────
     DESTELLOS EN LAS ESQUINAS
  ────────────────────────────────────────── */
  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #e83838;
    filter: blur(2px);
    opacity: 0;
    pointer-events: none;
  }
  .spark-1 { top: 12%;  left: 16%;  animation: sparkAnim 3.5s ease-in-out 2.2s infinite; }
  .spark-2 { top: 10%;  right: 14%; animation: sparkAnim 3.5s ease-in-out 3.0s infinite; }
  .spark-3 { bottom: 15%; left: 22%; animation: sparkAnim 3.5s ease-in-out 2.7s infinite; }
  .spark-4 { bottom: 12%; right: 18%; animation: sparkAnim 3.5s ease-in-out 3.4s infinite; }

  @keyframes sparkAnim {
    0%,100% { opacity: 0;    transform: scale(0.5); }
    30%,70% { opacity: 0.75; transform: scale(1.4); }
  }

  /* ──────────────────────────────────────────
     LÍNEA DE BARRIDO (shimmer) sobre el logo
  ────────────────────────────────────────── */
  .shimmer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    animation: shimmerReveal 0.01s 1.6s forwards;
  }
  @keyframes shimmerReveal { to { opacity: 1; } }

  .shimmer::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
      105deg,
      transparent 40%,
      rgba(255,255,255,0.12) 50%,
      transparent 60%
    );
    animation: shimmerMove 5s ease-in-out 1.8s infinite;
  }
  @keyframes shimmerMove {
    0%   { left: -60%; }
    40%  { left: 120%; }
    100% { left: 120%; }
  }

  /* ──────────────────────────────────────────
     TEXTO TAGLINE debajo del logo (opcional)
  ────────────────────────────────────────── */
  .tagline {
    text-align: center;
    margin-top: 18px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: clamp(11px, 1.4vw, 14px);
    font-weight: 300;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    opacity: 0;
    transform: translateY(10px);
    animation: taglineIn 0.8s ease-out 1.7s forwards;
  }
  @keyframes taglineIn {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="hero-logo-wrapper">

  <!-- Halo de luz roja -->
  <div class="halo"></div>

  <!-- Destellos -->
  <div class="spark spark-1"></div>
  <div class="spark spark-2"></div>
  <div class="spark spark-3"></div>
  <div class="spark spark-4"></div>

  <!-- Shimmer overlay -->
  <div class="shimmer"></div>

  <!-- Logo real -->
  <img
    class="logo-img"
    src="Logo_naranja-blanco_2CR.png"
    alt="2CR — 10 años"
    draggable="false"
  />

  <!-- Tagline opcional -->
  <p class="tagline">10 años transformando resultados</p>

</div>

</body>
</html>
