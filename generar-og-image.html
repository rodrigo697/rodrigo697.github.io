<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generar og-image 2CR</title>
<style>
  body { margin:0; background:#111; display:flex; flex-direction:column; align-items:center; padding:40px; font-family:Arial,sans-serif; color:#fff; }
  h2 { margin:0 0 16px; font-size:18px; color:#9CA3AF; }
  canvas { border:1px solid #333; display:block; max-width:100%; }
  button { margin-top:24px; background:#FF3D00; color:#fff; border:none; padding:14px 32px; border-radius:8px; font-size:16px; font-weight:700; cursor:pointer; }
  button:hover { background:#e03500; }
  p { color:#6B7280; font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<h2>og-image 2CR — preview (clic en descargar para guardar)</h2>
<canvas id="c" width="1200" height="630"></canvas>
<button onclick="descargar()">⬇ Descargar og-image.jpg</button>
<p>Guarda el archivo como <strong>og-image.jpg</strong> en la carpeta del repositorio (rodrigo697.github.io)</p>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

function roundRect(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.lineTo(x + w - r, y);
  cx.arcTo(x + w, y, x + w, y + r, r);
  cx.lineTo(x + w, y + h - r);
  cx.arcTo(x + w, y + h, x + w - r, y + h, r);
  cx.lineTo(x + r, y + h);
  cx.arcTo(x, y + h, x, y + h - r, r);
  cx.lineTo(x, y + r);
  cx.arcTo(x, y, x + r, y, r);
  cx.closePath();
}

function draw() {
  const W = 1200, H = 630;

  // ── Fondo ────────────────────────────────────────────────
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(0, 0, W, H);

  // ── Círculos decorativos (esquina superior derecha) ──────
  ctx.strokeStyle = '#1D1D1D';
  ctx.lineWidth = 1.5;
  [300, 480, 660, 840].forEach(r => {
    ctx.beginPath();
    ctx.arc(W, 0, r, 0, Math.PI * 2);
    ctx.stroke();
  });

  // ── Barra naranja izquierda ──────────────────────────────
  ctx.fillStyle = '#FF3D00';
  ctx.fillRect(0, 0, 6, H);

  // ── Línea inferior sutil ─────────────────────────────────
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#FF3D00';
  ctx.fillRect(0, H - 3, W, 3);
  ctx.globalAlpha = 1;

  // ── Logo 2CR — dibujado con canvas puro ──────────────────
  // Número "2"
  ctx.fillStyle = '#FF3D00';
  ctx.font = 'bold 110px Arial Black, Arial, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText('2', 80, 90);

  // "CR"
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 110px Arial Black, Arial, sans-serif';
  ctx.fillText('CR', 164, 90);

  // Punto naranja decorativo tras CR
  ctx.fillStyle = '#FF3D00';
  ctx.beginPath();
  ctx.arc(330, 188, 9, 0, Math.PI * 2);
  ctx.fill();

  // Línea bajo el texto (Tagline separator)
  ctx.fillStyle = '#FF3D00';
  ctx.fillRect(80, 230, 52, 4);

  // ── Tagline ───────────────────────────────────────────────
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 50px Arial, sans-serif';
  ctx.fillText('Consultoría y Servicios', 80, 305);
  ctx.fillText('de Ingeniería', 80, 368);

  // ── Subtítulo ─────────────────────────────────────────────
  ctx.fillStyle = '#9CA3AF';
  ctx.font = '23px Arial, sans-serif';
  ctx.fillText('Chile  ·  Perú  ·  Desde 2016', 80, 422);

  // ── Badges derecha ────────────────────────────────────────
  const badges = [
    { n: '10+',   s: 'AÑOS DE EXPERIENCIA'  },
    { n: 'ISO',   s: '9001 · 14001 · 45001' },
    { n: 'SOMNI', s: 'IA PARA LA INDUSTRIA' },
  ];
  const bx = 820, bw = 310, bh = 108, gap = 20;
  badges.forEach((b, i) => {
    const by = 96 + i * (bh + gap);

    // Fondo badge
    ctx.fillStyle = '#141414';
    roundRect(ctx, bx, by, bw, bh, 12);
    ctx.fill();

    // Borde sutil
    ctx.strokeStyle = '#2A2A2A';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Acento naranja izquierdo en el badge
    ctx.fillStyle = '#FF3D00';
    ctx.fillRect(bx, by + 20, 3, bh - 40);

    // Número / Sigla
    const fs = b.n.length > 3 ? 26 : 34;
    ctx.fillStyle = '#FF3D00';
    ctx.font = `bold ${fs}px Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(b.n, bx + bw / 2, by + 56);

    // Etiqueta
    ctx.fillStyle = '#6B7280';
    ctx.font = '12px Arial, sans-serif';
    ctx.fillText(b.s, bx + bw / 2, by + 80);
    ctx.textAlign = 'left';
  });

  // ── URL footer ────────────────────────────────────────────
  ctx.fillStyle = '#374151';
  ctx.font = '15px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('rodrigo697.github.io', W / 2, H - 24);
  ctx.textAlign = 'left';
}

function descargar() {
  try {
    const link = document.createElement('a');
    link.download = 'og-image.jpg';
    link.href = c.toDataURL('image/jpeg', 0.93);
    link.click();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

draw();
</script>
</body>
</html>
