<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generar og-image 2CR</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#111; display:flex; flex-direction:column; align-items:center; padding:40px 20px; font-family:Arial,sans-serif; color:#fff; gap:20px; }
  h2 { margin:0; font-size:18px; color:#9CA3AF; }
  canvas { border:1px solid #333; display:block; max-width:100%; }

  .upload-zone {
    display:flex; align-items:center; gap:16px;
    background:#1a1a1a; border:1px solid #333; border-radius:10px;
    padding:16px 24px; width:100%; max-width:760px;
  }
  .upload-zone label {
    background:#FF3D00; color:#fff; border:none; padding:10px 20px;
    border-radius:7px; font-size:14px; font-weight:700; cursor:pointer;
    white-space:nowrap;
  }
  .upload-zone label:hover { background:#e03500; }
  #file-name { color:#6B7280; font-size:13px; }
  #status-ok { color:#22c55e; font-size:13px; display:none; }

  .actions { display:flex; gap:16px; }
  button.primary {
    background:#FF3D00; color:#fff; border:none; padding:14px 32px;
    border-radius:8px; font-size:16px; font-weight:700; cursor:pointer;
  }
  button.primary:hover { background:#e03500; }
  button.primary:disabled { background:#555; cursor:not-allowed; }
  button.secondary {
    background:#222; color:#9CA3AF; border:1px solid #333; padding:14px 24px;
    border-radius:8px; font-size:14px; cursor:pointer;
  }
  button.secondary:hover { background:#2a2a2a; }
  p.hint { color:#6B7280; font-size:12px; margin:0; text-align:center; }
</style>
</head>
<body>

<h2>Generador og-image 2CR — 1200 × 630 px</h2>

<div class="upload-zone">
  <label for="logo-file">📂 Seleccionar logo PNG</label>
  <input type="file" id="logo-file" accept="image/png,image/webp,image/jpeg" style="display:none">
  <span id="file-name">Elige el archivo: <strong>Logo 2CR_PRO naranja full.png</strong></span>
  <span id="status-ok">✓ Logo cargado</span>
</div>

<canvas id="c" width="1200" height="630"></canvas>

<div class="actions">
  <button class="secondary" onclick="drawSinLogo()">Vista previa sin logo</button>
  <button class="primary" id="btn-dl" onclick="descargar()">⬇ Descargar og-image.jpg</button>
</div>

<p class="hint">Guarda el archivo descargado como <strong>og-image.jpg</strong> en la carpeta <strong>rodrigo697.github.io</strong> y reemplaza el existente.</p>

<script>
const c   = document.getElementById('c');
const ctx = c.getContext('2d');
let logoImg = null;

// ── Leer PNG con FileReader (no contamina el canvas) ──────────────────────
document.getElementById('logo-file').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('file-name').style.display = 'none';
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      logoImg = img;
      document.getElementById('status-ok').style.display = 'inline';
      draw(img);
    };
    img.src = ev.target.result; // data URL — no contamina el canvas
  };
  reader.readAsDataURL(file);
});

function roundRect(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.lineTo(x + w - r, y);
  cx.arcTo(x + w, y, x + w, y + r, r);
  cx.lineTo(x + w, y + h - r);
  cx.arcTo(x + w, y + h, x + w - r, y + h, r);
  cx.lineTo(x + r, y + h);
  cx.arcTo(x, y + h, x, y + h - r, r);
  cx.lineTo(x, y + r);
  cx.arcTo(x, y, x + r, y, r);
  cx.closePath();
}

function drawBase() {
  const W = 1200, H = 630;

  // Fondo
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(0, 0, W, H);

  // Círculos decorativos (esquina superior derecha)
  ctx.strokeStyle = '#1D1D1D';
  ctx.lineWidth = 1.5;
  [300, 480, 660, 840].forEach(r => {
    ctx.beginPath();
    ctx.arc(W, 0, r, 0, Math.PI * 2);
    ctx.stroke();
  });

  // Barra naranja izquierda
  ctx.fillStyle = '#FF3D00';
  ctx.fillRect(0, 0, 6, H);

  // Línea inferior sutil
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#FF3D00';
  ctx.fillRect(0, H - 3, W, 3);
  ctx.globalAlpha = 1;
}

function drawContent() {
  const W = 1200, H = 630;

  // ── Divisor naranja bajo el logo ─────────────────────────
  ctx.fillStyle = '#FF3D00';
  ctx.fillRect(80, 232, 52, 4);

  // ── Tagline principal ─────────────────────────────────────
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 50px Arial, sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Consultoría y Servicios', 80, 305);
  ctx.fillText('de Ingeniería', 80, 368);

  // ── Subtítulo: "Innovación útil" naranja + resto blanco ───
  ctx.font = '24px Arial, sans-serif';
  const parte1 = 'Innovación útil';
  const parte2 = ' para empresas en movimiento.';
  ctx.fillStyle = '#FF5C00';
  ctx.fillText(parte1, 80, 418);
  const anchoP1 = ctx.measureText(parte1).width;
  ctx.fillStyle = '#E5E7EB';
  ctx.fillText(parte2, 80 + anchoP1, 418);

  // ── Badges derecha — nuevo estilo ────────────────────────
  const badges = [
    { l1: 'Donde la ingeniería', l1c: '#FF5C00', l2: 'se pone a trabajar.', l2c: '#FFFFFF' },
    { l1: 'ISO',                 l1c: '#FF5C00', l2: '9001 – 14001 – 45001', l2c: '#FFFFFF' },
    { l1: 'En terreno, todos',   l1c: '#FFFFFF', l2: 'los días.',            l2c: '#FFFFFF', l2accent: 'días.' },
  ];

  const bx = 790, bw = 350, bh = 116, gap = 18;
  badges.forEach((b, i) => {
    const by = 88 + i * (bh + gap);

    // Fondo badge
    ctx.fillStyle = '#141414';
    roundRect(ctx, bx, by, bw, bh, 12);
    ctx.fill();
    ctx.strokeStyle = '#272727';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Barra naranja izquierda
    ctx.fillStyle = '#FF5C00';
    ctx.fillRect(bx, by + 18, 4, bh - 36);

    const tx = bx + 24; // texto inicia después de la barra

    // Línea 1
    ctx.font = 'bold 22px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = b.l1c;
    ctx.fillText(b.l1, tx, by + 52);

    // Línea 2 — con posible palabra naranja al final
    ctx.font = '18px Arial, sans-serif';
    if (b.l2accent) {
      // "los " blanco + "días." naranja
      const sinAccent = b.l2.replace(b.l2accent, '');
      ctx.fillStyle = '#D1D5DB';
      ctx.fillText(sinAccent, tx, by + 84);
      const anchoSin = ctx.measureText(sinAccent).width;
      ctx.fillStyle = '#FF5C00';
      ctx.fillText(b.l2accent, tx + anchoSin, by + 84);
    } else {
      ctx.fillStyle = '#D1D5DB';
      ctx.fillText(b.l2, tx, by + 84);
    }
    ctx.textAlign = 'left';
  });

  // ── URL footer ────────────────────────────────────────────
  ctx.fillStyle = '#4B5563';
  ctx.font = '16px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('www.2crconsultores.com', W / 2, H - 24);
  ctx.textAlign = 'left';
}

function draw(img) {
  drawBase();

  // Dibujar logo oficial — centrado verticalmente en zona superior izquierda
  if (img) {
    const logoH = 110;
    const logoW = (img.width / img.height) * logoH;
    ctx.drawImage(img, 80, 100, logoW, logoH);
  }

  drawContent();
}

function drawSinLogo() {
  drawBase();
  // Placeholder de texto si no hay logo
  ctx.fillStyle = '#FF3D00';
  ctx.font = 'bold 100px Arial Black, Arial, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText('2', 80, 90);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('CR', 163, 90);
  ctx.textBaseline = 'alphabetic';
  drawContent();
}

function descargar() {
  try {
    const link = document.createElement('a');
    link.download = 'og-image.jpg';
    link.href = c.toDataURL('image/jpeg', 0.93);
    link.click();
  } catch(e) {
    alert('Error al exportar: ' + e.message + '\n\nAsegúrate de haber cargado el logo con el selector de archivo.');
  }
}

// Renderizar sin logo al inicio
drawSinLogo();
</script>
</body>
</html>
